stages:
  - build
  - test
  - deploy
  - revert

variables:
  docker_html_path: "/www"
  env: prod
  deploy_subfolder: html

default:
  tags:
    - deploy_react

install_dependencies:
  image: node:14.15.0-stretch
  stage: build
  script:
    - yarn install
    - yarn build
    - mv build build_$env
  cache:
    - key:
        files:
          - yarn.lock
      paths:
        - node_modules
  artifacts:
    paths:
      - build_$env
    expire_in: 1 week
  only:
    - master

build_staging:
  image: node:14.15.0-stretch
  stage: build
  variables:
    env: staging
    REACT_APP_WEBSITE_PREFIX: "[staging] [branch=$CI_COMMIT_BRANCH] "
    PUBLIC_URL: "/staging/$CI_COMMIT_BRANCH"
  script:
    - yarn install
    - yarn build
    - mv build build_$env
  cache:
    - key:
        files:
          - yarn.lock
      paths:
        - node_modules
  artifacts:
    paths:
      - build_$env
    expire_in: 1 week
  only:
    - master
    - /^feature-.*$/

deploy_prod:
  image: alpine:latest
  stage: deploy
  script:
    - echo "Деплой prod-версии"
    - mkdir -p $docker_html_path/test-app
    - rm -rf $docker_html_path/test-app/${env}_$CI_COMMIT_SHA
    - cp -r build_$env $docker_html_path/test-app/${env}_$CI_COMMIT_SHA
    - cp -Pv $docker_html_path/$deploy_subfolder $docker_html_path/test-app/${env}_$CI_COMMIT_SHA/prev-version || true
    - ls -la $docker_html_path/test-app/${env}_$CI_COMMIT_SHA
  only:
    - master

deploy_staging:
  image: alpine:latest
  stage: deploy
  variables:
    env: staging
    deploy_subfolder: staging/$CI_COMMIT_BRANCH
  script:
    - echo "Деплой staging-версии из ветки $CI_COMMIT_BRANCH"
    - mkdir -p $docker_html_path/test-app
    - mkdir -p $docker_html_path/staging
    - rm -rf $docker_html_path/test-app/${env}_$CI_COMMIT_SHA
    - cp -r build_$env $docker_html_path/test-app/${env}_$CI_COMMIT_SHA
    - cp -Pv $docker_html_path/$deploy_subfolder $docker_html_path/test-app/${env}_$CI_COMMIT_SHA/prev-version || true
    - ls -la $docker_html_path/test-app/${env}_$CI_COMMIT_SHA
  only:
    - master
    - /^feature-.*$/

activate_prod:
  image: alpine:latest
  stage: deploy
  script:
    - echo "Активируем prod-версию через symlink"
    - ln -fsnv $docker_html_path/test-app/${env}_$CI_COMMIT_SHA $docker_html_path/$deploy_subfolder
    - echo "Текущая активная prod-версия:"
    - readlink -f $docker_html_path/$deploy_subfolder
  when: manual
  only:
    - master

activate_staging:
  image: alpine:latest
  stage: deploy
  variables:
    env: staging
    deploy_subfolder: staging/$CI_COMMIT_BRANCH
  script:
    - echo "Активируем staging-версию через symlink"
    - mkdir -p $docker_html_path/staging
    - ln -fsnv $docker_html_path/test-app/${env}_$CI_COMMIT_SHA $docker_html_path/$deploy_subfolder
    - echo "Текущая активная staging-версия:"
    - readlink -f $docker_html_path/$deploy_subfolder
  when: always
  only:
    - master
    - /^feature-.*$/

revert:
  image: alpine:latest
  stage: revert
  when: manual
  script:
    - echo "Откат на одну версию назад"

    - echo "Текущая активная версия:"
    - readlink -f $docker_html_path/html

    - export CURRENT_VERSION=$(readlink -f $docker_html_path/html)
    - test -n "$CURRENT_VERSION" || (echo "Не найдена текущая активная версия"; exit 1)

    - echo "Предыдущая версия:"
    - export PREVIOUS_VERSION=$(readlink -f $CURRENT_VERSION/prev-version)
    - test -n "$PREVIOUS_VERSION" || (echo "Не найдена предыдущая версия для отката"; exit 1)
    - echo "$PREVIOUS_VERSION"

    - echo "Переключаем html на предыдущую версию"
    - ln -fsnv $PREVIOUS_VERSION $docker_html_path/html

    - echo "Теперь активная версия:"
    - readlink -f $docker_html_path/html
  only:
    - master

revert_two_versions:
  image: alpine:latest
  stage: revert
  when: manual
  script:
    - echo "Откат на две версии назад"

    - echo "Текущая активная версия:"
    - readlink -f $docker_html_path/html

    - export CURRENT_VERSION=$(readlink -f $docker_html_path/html)
    - test -n "$CURRENT_VERSION" || (echo "Не найдена текущая активная версия"; exit 1)

    - echo "Первая предыдущая версия:"
    - export PREVIOUS_VERSION=$(readlink -f $CURRENT_VERSION/prev-version)
    - test -n "$PREVIOUS_VERSION" || (echo "Не найдена предыдущая версия"; exit 1)
    - echo "$PREVIOUS_VERSION"

    - echo "Версия на две версии назад:"
    - export TWO_VERSIONS_BACK=$(readlink -f $PREVIOUS_VERSION/prev-version)
    - test -n "$TWO_VERSIONS_BACK" || (echo "Не найдена версия на две версии назад. Нужно минимум 3 успешных деплоя."; exit 1)
    - echo "$TWO_VERSIONS_BACK"

    - echo "Переключаем html на версию две назад"
    - ln -fsnv $TWO_VERSIONS_BACK $docker_html_path/html

    - echo "Теперь активная версия:"
    - readlink -f $docker_html_path/html
  only:
    - master
